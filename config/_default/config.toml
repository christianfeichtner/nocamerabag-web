baseURL = 'https://nocamerabag.com/'
locale = 'en-us'
title = 'No Camera Bag'
theme = 'papermod'
paginate = 9
enableRobotsTXT = true

[taxonomies]
    category = "categories"
    tag = "tags"

[permalinks]
    [permalinks.taxonomy]
        categories = "/blog/categories"
        tags = "/blog/tags"

    [permalinks.term]
        categories = "/blog/:slug"
        tags = "/blog/:slug"

[security]
    [security.http]
        methods = ['(?i)GET|POST']
        urls = ['.*']
        mediaTypes = ['.*']
    [security.funcs]
        getenv = ['^HUGO_', '^CI$', '^BUILD_']

[params]
    defaultTheme = "light"
    disableThemeToggle = true # Bleibt permanent hell, passend zu deinem aktuellen Design
    showToc = false
    TocOpen = true
    disableSpecial1stPost = true
    mainSections = ["blog"]
    arrow_symbol = "›"

    [params.profileMode]
        enabled = false
        title = "No Camera Bag"
        subtitle = "Hi, ich bin Chris. In meinem Fotoblog schreibe ich über iPhone-Fotografie, Bildbearbeitung und urbane Entdeckungen."

    [params.blog]
        social_text = "To stay up to date with new and updated blog posts, please consider following on social media. I'm mostly active on [Twitter](https://twitter.com/nocamerabag), [Instagram](https://instagram.com/nocamerabag), followed by [Facebook](https://facebook.com/nocamerabag) and [Pinterest](https://pinterest.com/nocamerabag)."

    [params.comments]
        build_fetch = true
        api_url = "https://comments-api.nocamerabag.com"

    [params.ratings]
        enabled = true
        build_fetch = true
        api_url = "https://ratings-api.nocamerabag.com"
        min_average = 4.2
        min_votes = 2

[[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 1

[[menu.main]]
    name = "iPhone Photography"
    url = "/iphone-photography/"
    weight = 2

[[menu.main]]
    name = "Portfolio"
    url = "/portfolio/"
    weight = 3

[[menu.main]]
    name = "Urbex Tours"
    url = "/urbex-tours/"
    weight = 4

[[menu.main]]
    name = "Traveling Light"
    url = "/traveling-light/"
    weight = 5
