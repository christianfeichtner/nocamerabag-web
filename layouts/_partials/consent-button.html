<button type="button" class="consent-trigger-btn" id="consent-trigger-btn" aria-label="Datenschutz- und Cookie-Einstellungen öffnen" title="Datenschutzeinstellungen">
  <svg class="consent-trigger-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </svg>
</button>
<script>
  (function () {
    var btn = document.getElementById('consent-trigger-btn');
    if (btn) {
      btn.addEventListener('click', function () {
        if (window.zaraz && window.zaraz.consent) {
          zaraz.consent.modal = true;
        }
      });
    }
  })();
</script>
