{{ $type := .Get "type" | default "info" }}
{{ $title := .Get "title" }}
{{ if not $title }}
  {{ if eq $type "warning" }}{{ $title = "Achtung" }}{{ else }}{{ $title = "Wichtig" }}{{ end }}
{{ end }}

<div class="callout callout-{{ $type }}">
  <div class="callout-icon-wrapper">
    {{ if eq $type "warning" }}
      <svg class="callout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    {{ else }}
      <svg class="callout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    {{ end }}
  </div>
  <div class="callout-content">
    <span class="callout-title">{{ $title }}</span>
    {{ .Inner | markdownify }}
  </div>
</div>
