name: Daily Pages Rebuild

on:
  schedule:
    # Täglich um 02:00 UTC (04:00 Uhr Wiener Sommerzeit)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  trigger-build:
    name: Trigger Build via Empty Commit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Empty Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(rebuild): daily automated build $(date +'%Y-%m-%d')"
          git push origin main
